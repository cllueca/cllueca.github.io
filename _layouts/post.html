---
layout: default
---
<main class="blog-main">
  <article class="post-article">

    <!-- BACK LINK -->
    <div class="post-back">
      <a href="/blog/" class="post-back-link">← Back to blog</a>
    </div>

    <!-- POST HEADER -->
    <header class="post-header">
      <div class="post-header-meta">
        <span class="post-category cat-{{ page.category }}">{{ page.category }}</span>
        <span class="post-date">{{ page.date | date: "%B %d, %Y" }}</span>
        {% if page.read_time %}
        <span class="read-time">· {{ page.read_time }} min read</span>
        {% endif %}
      </div>
      <h1 class="post-title">{{ page.title }}</h1>
      <div class="post-header-rule"></div>
    </header>

    <!-- POST BODY -->
    <div class="post-content">
      {{ content }}
    </div>

    <!-- POST FOOTER -->
    <footer class="post-footer-nav">
      <a href="/blog/" class="post-back-link">← Back to blog</a>
    </footer>

  </article>
</main>
